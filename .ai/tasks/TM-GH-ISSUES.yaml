  landmines:
    - 距離原点を検索確定で search にしてはいけない（TM-DIST / #33）
    - DeepLinkResolver は MapContainer 内。DOM バナーは ToiletMap 側（MapContainer の外）
    - ピン色は ACCESS_LEVELS が真実。CSS で色を決め直さない
    - area bbox は [southLat, westLng, northLat, eastLng]。API bbox は minLng,minLat,maxLng,maxLat。混ぜない
    - AutoLocate は ?id= があるとき既にスキップ。lat/lng エリアリンクでもスキップすること
    - 推定ピンの `(${cat.label})` をやめると既存 DB は残る。表示側 sanitizer 必須

plan:
  steps:
    - src/lib/toiletName.ts に usableToiletName。種別ラベルのみの括弧名と HTTP/HTML エラー文を null。壊れた括弧の実名は残す
    - toiletDisplayName / isToiletIndexable の NAMED / ToiletList / PinSheet が usableToiletName を使う
    - osm.ts: pickName 結果を usableToiletName。inferred の ?? `(${cat.label})` を廃止して null
    - areas.ts に areaMapView。area page の viewAreaOnMap だけ query 付き（backToMap は / のまま）
    - src/lib/mapViewQuery.ts に parseMapViewQuery。DeepLinkResolver が id 優先、なければ lat/lng/zoom で flyTo
    - AutoLocate: id または map view query またはオンボーディング未閉じなら GPS しない。閉じたら 1 回取得（custom event）
    - LocateControl: try/catch + 8s 自己 timeout で setBusy(false)。拒否時は store notice
    - ToiletMap 外に notice バナー（deepLinkMissing / locateDenied）。地図に戻るで id を消して notice を閉じる
    - AddToiletFlow: selectedId なら FAB 非表示
    - EmptyState: 検索バー下へ。内側 pointer-events-auto を検索と重ねない
    - SearchBar.select: useMapStore.getState().select(null)
    - SearchBar: 0件/エラー時も open。Enter で noResults 表示。成功時は消す
    - messages 4 言語
    - テストは tester 担当。実装エージェントは *.test.ts を新規作成しない
  risks:
    - エリアリンクと保存ビューの競合（flyTo で上書きすれば足りる）
    - オンボーディング event 名の取りこぼし（STORAGE_KEY と一致させる）
    - usableToiletName が正規の短い名前を落としすぎる（「駅」単体は残す。括弧+既知ラベルのみ落とす）

