interfaces:
  usableToiletName: |
    export function usableToiletName(raw: string | null | undefined): string | null
    // null/空白 → null
    // 全体が (駅) or （駅）or (ショッピングモール・百貨店) 等 INFERRED_CATEGORIES.label → null
    // /^\d{3}\b/ または /not found/i または /<html/i または /internal server error/i → null
    // それ以外（括弧欠ける「西鉄天神高速バスターミナル)」含む）は trim して返す
  areaMapView: |
    export function areaMapView(area: Area): { lat: number; lng: number; zoom: number }
    // lat/lng = bbox 中心。zoom = prefecture 9 / city 13
  parseMapViewQuery: |
    export function parseMapViewQuery(params: URLSearchParams): { lat: number; lng: number; zoom: number } | null
    // lat/lng 必須・範囲内。zoom 省略時 13。不正は null
  onboardingEvent: |
    OnboardingCard dismiss 時 window.dispatchEvent(new Event("loo-onboarding-dismissed"))
    STORAGE_KEY は既存 toilet-map.onboarding.dismissed
  mapNotice: |
    mapStore に notice: { kind: "deepLinkMissing" | "locateDenied" } | null と setNotice
    ToiletMap が MapContainer の外で表示
